name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR makes its older run useless; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      # search_code wraps ripgrep; without it its tests are skipped instead of run.
      - run: command -v rg || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - run: python -m pip install pytest
      # run_tests refuses to run without bwrap; Ubuntu 24.04 blocks unprivileged user namespaces via AppArmor
      # by default, so without the sysctl the sandbox tests would have nothing to run on.
      - run: |
          sudo apt-get install -y bubblewrap || (sudo apt-get update && sudo apt-get install -y bubblewrap)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / -- /bin/true
      - run: npm test
      # Runs once D0 adds the `eval` script; mock provider, so no API key is needed.
      - run: npm run eval --if-present

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action needs a paid license on organization repos; the CLI is free and scans the same commits.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose ${RANGE:+--log-opts="$RANGE"} .
